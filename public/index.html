<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#ece9e1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><title>VGC · 扑克牌俱乐部</title><link rel="stylesheet" href="/style.css"><script src="/audio.js" defer></script><script src="/conveyor.js" defer></script><script src="/splashes.js" defer></script><script src="/playtest.js" defer></script><script src="/app.js" defer></script>
</head>
<body>
<div class="app-shell">
  <main>

    <div id="view"></div>
    <footer><button class="text-button" data-action="rules">玩法手册 ↗</button><button class="text-button" data-action="settings">设置 ↗</button></footer>
  </main>
</div>
<dialog id="modal"><div class="modal-top"><button class="icon-button" data-action="close" aria-label="关闭">×</button></div><div id="modal-content"></div></dialog>
<dialog id="playtest-replay-dialog" aria-labelledby="replay-title"></dialog>
<dialog id="seat-profile" aria-labelledby="seat-profile-name">
  <form method="dialog" class="profile-close"><button class="icon-button" type="submit" aria-label="关闭玩家资料" autofocus>×</button></form>
  <span class="profile-suit" aria-hidden="true"></span><h2 id="seat-profile-name"></h2><p class="profile-id"></p>
  <div class="seat-profile-detail" aria-live="polite"></div>
</dialog>
<small class="app-version">S0 V0.10.1</small>
<div id="connection-notice" role="status" hidden>连接中断，正在重连…</div>
<div id="toast" role="status" aria-live="polite"></div>
</body></html>
